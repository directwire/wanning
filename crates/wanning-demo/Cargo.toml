[package]
name = "wanning-demo"
description = "Wanning P0 CLI demo:GLM 决策循环 + 闸 + 开放平台/支付通道 adapter(今晚全离线 + 本地 mock)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# 双 bin 后 `cargo run -p wanning-demo` 需要指认默认 bin(README/docs 既有命令不破)。
default-run = "wanning-demo"

[dependencies]
wanning-core.workspace = true
serde.workspace = true
# raw_value feature(W-50):同步响应验签必须拿 `alipay_trade_pay_response` 成员的
# 逐字节原文(RawValue 保真),不能经过 Value 归一化。
serde_json = { workspace = true, features = ["raw_value"] }
ureq.workspace = true
# W-50 支付宝真实报文模板:base64(sign 编解码)+ percent-encoding(表单/URL 编码)。
# 两 crate 已在依赖树里(ureq 的传递依赖),这里只声明直用,**零新增 crate**。
base64 = "0.22"
percent-encoding = "2.3"
# W-31(A 案,本仓第一个运行时外部加密依赖):审计锚点 v2 的 ed25519 签名/验签。
# 非对称签名手写不可接受——哈希能手写因为 spec 短、向量密;曲线实现边缘 case
# 致命。只进本 crate(所有者侧工具面):core/闸/MCP/SDK 依赖树零增长。
ed25519-dalek = "2"
# W-52:RSA2 签名/验签的 env 注入实现(`EnvRsaSigner`/`EnvRsaVerifier`,见
# src/signing.rs)——channel-test L1「签名自测」要拿 env 里的真密钥真签真验。
# W-28 混合案的修正:rsa/sha2 从 dev-deps 转正为**本 crate 运行时依赖**(W-31
# 同款先例与边界:非对称签名手写不可接受;只进所有者侧工具面,core/闸/MCP/SDK
# 依赖树零增长)。`sha2` feature = rsa 的可选依赖(隐式 feature,启用 oid),
# SigningKey/VerifyingKey 的 `new` 构造器需要 digest 的 AssociatedOid bound。
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"

[dev-dependencies]
# W-28 起 rand 仅测试面:现场生成测试 RSA 密钥对(自生成自销毁,绝不真商户
# 密钥,绝不落仓)。
rand = "0.8"

[[bin]]
name = "wanning-demo"
path = "src/main.rs"

# W-31:独立第三方验签 bin——只验 ed25519 锚点 v2,无 --key 选项(公钥随锚点走)。
[[bin]]
name = "wanning-anchor-verify"
path = "src/bin/wanning-anchor-verify.rs"
